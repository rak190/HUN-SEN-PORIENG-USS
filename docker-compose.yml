services:
  postgres:
    image: postgres:16-alpine
    container_name: kruai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - kruai_pgdata:/var/lib/postgresql/data
      - ./docker/init-all.sql:/docker-entrypoint-initdb.d/init-all.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:latest
    container_name: kruai-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgrespassword123@postgres:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_OPENAPI_MODE: follow-privileges
      PGRST_JWT_SECRET: supersecretjwtsecretforlocaltestingmustbeatleast32characterslong

volumes:
  kruai_pgdata:
    driver: local
